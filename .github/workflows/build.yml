name: Build MISHAP RP RADIO portable EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'main.js'
      - 'preload.js'
      - 'package.json'
      - 'assets/**'
      - '.github/workflows/build.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build portable EXE
        run: npm run build:win
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MISHAP-RP-RADIO-Portable
          path: release/*.exe
          if-no-files-found: error
